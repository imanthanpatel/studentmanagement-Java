<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}"></head>

<body>
<div class="d-flex" id="wrapper">

    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <div id="page-content-wrapper">

        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 mt-4">

            <form th:action="@{/enroll/save}" th:object="${enrollment}" method="post">

                <input type="hidden" th:field="*{totalFee}" id="totalHidden"/>

                <div class="row g-4">

                    <!-- LEFT SIDE -->
                    <div class="col-lg-8">
                        <div class="card h-100 shadow-sm">
                            <div class="card-header bg-white fw-semibold">
                                <i class="bi bi-list-check me-1"></i> Course Selection
                            </div>

                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle">
                                        <thead>
                                        <tr>
                                            <th>Select</th>
                                            <th>Course Name</th>
                                            <th class="text-end">Fee</th>
                                        </tr>
                                        </thead>

                                        <tbody>
                                        <tr th:each="course : ${courses}">
                                            <td>
                                                <input class="form-check-input"
                                                       type="checkbox"
                                                       th:field="*{courseIds}"
                                                       th:value="${course.id}"
                                                       th:data-fee="${course.fee}">
                                            </td>
                                            <td th:text="${course.courseName}"></td>
                                            <td class="text-end"
                                                th:text="${#numbers.formatDecimal(course.fee,1,'COMMA',2,'POINT')}">
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT SIDE -->
                    <div class="col-lg-4">
                        <div class="card h-100 shadow-sm">
                            <div class="card-header bg-white fw-semibold">
                                <i class="bi bi-person-check me-1"></i> Student & Summary
                            </div>

                            <div class="card-body d-flex flex-column gap-3">

                                <!-- STUDENT -->
                                <div>
                                    <label class="form-label">Select Student</label>
                                    <select class="form-select" th:field="*{studentId}">
                                        <option value="">Select Student</option>
                                        <option th:each="s : ${students}"
                                                th:value="${s.id}"
                                                th:text="${s.firstName + ' ' + s.lastName + ' (' + s.email + ')'}">
                                        </option>
                                    </select>
                                </div>

                                <!-- SUMMARY -->
                                <div class="p-3 bg-light border rounded">
                                    <div class="d-flex justify-content-between mb-1">
                                        <span class="text-muted">Courses Selected</span>
                                        <strong id="count">0</strong>
                                    </div>
                                    <div class="d-flex justify-content-between">
                                        <span class="text-muted">Total Fee</span>
                                        <strong class="text-primary" id="total">0.00</strong>
                                    </div>
                                </div>

                                <!-- BUTTONS -->
                                <div class="d-flex gap-2 mt-auto">
                                    <a th:href="@{/dashboard}"
                                       class="btn btn-outline-secondary w-100">
                                        Cancel
                                    </a>

                                    <button type="submit"
                                            class="btn btn-primary w-100">
                                        Enroll
                                    </button>
                                </div>

                            </div>
                        </div>
                    </div>

                </div>

            </form>

        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>

<!-- JS -->
<script>
    const checkboxes = document.querySelectorAll("input[type='checkbox']");
    const totalEl = document.getElementById("total");
    const countEl = document.getElementById("count");
    const totalHidden = document.getElementById("totalHidden");

    checkboxes.forEach(cb => {
        cb.addEventListener("change", () => {
            let total = 0;
            let count = 0;

            checkboxes.forEach(c => {
                if (c.checked) {
                    total += parseFloat(c.dataset.fee);
                    count++;
                }
            });

            totalEl.innerText = total.toFixed(2);
            countEl.innerText = count;
            totalHidden.value = total.toFixed(2);
        });
    });
</script>

</body>
</html>
